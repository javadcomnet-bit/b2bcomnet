name: Apply Florence inventory update

on:
  push:
    paths:
      - '.github/workflows/apply-florence-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconcile Florence inventory
        run: python tools/update_florence.py
      - name: Validate inventory data
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert text.count('v: "Florence"') == 62
          assert 'Dell Alienware 16X Aurora AC16251' not in text
          assert '9S7-182432-420' in text
          assert '90NB1511-M00BU0' in text
          print('Florence validation passed: 62 items')
          PY
      - name: Commit and push inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Update Florence inventory from Sept 21 sheets"
          git push origin HEAD:main
